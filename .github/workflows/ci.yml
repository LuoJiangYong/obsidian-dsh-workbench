name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Phase A (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: 锁文件安装
        run: npm ci

      - name: TypeScript 检查
        run: npm run typecheck

      - name: 代码规范
        run: npm run lint

      - name: 单元与契约测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 安装精确锁定的 DSH alpha.3 候选夹具
        run: npm run prepare:runtime-candidate-fixture

      - name: 双平台 DSH alpha.3 正式控制面候选验收
        run: npm run test:runtime:candidate

      - name: 安装精确锁定的 DSH alpha.3 生产运行夹具
        if: runner.os == 'Windows'
        run: npm run prepare:runtime-fixture

      - name: Windows DSH 进程与 shim 专项测试
        if: runner.os == 'Windows'
        run: npm run test:runtime

      - name: Windows DSH alpha.3 正式 bridge 运行验收
        if: runner.os == 'Windows'
        run: npm run test:bridge:runtime

      - name: 治理与仓库边界验证
        run: npm run verify
